<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T16RR1H7RX"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T16RR1H7RX');

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Your Poodle Circle profile</title>
<meta name="description" content="Your private toy poodle owner profile."/>
<link rel="icon" href="../favicon.ico" sizes="32x32"/>
<link rel="icon" type="image/png" href="../assets/favicon.png"/>
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/circle.css"/>
<script>
try {
  if (localStorage.getItem("poodlecircle-theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch (e) {}
</script>
</head>
<body data-page="profile">
<header class="bar">
  <a class="brand" href="../">
    <img class="site-logo-light" alt="Poodle Circle" src="../assets/logo.png"/>
    <img class="site-logo-dark" alt="Poodle Circle" src="../assets/logo-dark.png"/>
  </a>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">☾</button>
</header>
<main class="page">
  <p class="kicker">Your profile</p>
  <h1>The circle, just for you</h1>
  <p class="lede">This page is yours. Other visitors cannot open it, and it is not a public directory.</p>
  <section class="card" id="profile-gate" hidden>
    <p class="lede" id="gate-copy" style="margin-top: 0;">Sign in to see the profile saved with your email.</p>
    <div class="actions">
      <a class="primary" href="../join/?mode=signin">Sign in</a>
      <a class="ghost" href="../join/">Register</a>
    </div>
  </section>
  <section class="card" id="profile-card" hidden>
    <div class="photo" id="photo">
      <img id="dog-photo-img" alt="Your toy poodle" hidden/>
      <div class="photo-empty" id="photo-empty">
        <p class="note" id="photo-hint">A picture of your toy poodle, just for this profile.</p>
        <label class="ghost file-label">
          <span id="photo-label-text">Add your dog's picture</span>
          <input class="file-input" id="dog-photo" accept="image/jpeg,image/png,image/webp" type="file"/>
        </label>
      </div>
    </div>
    <p class="error" id="photo-error" hidden></p>
    <div class="profile-top">
      <div class="mark" id="mark" aria-hidden="true">P</div>
      <div>
        <p class="kicker">Owner</p>
        <p class="puppy" id="owner-name" style="margin-top: 4px;"></p>
      </div>
    </div>
    <h2 class="puppy" id="puppy-name"></h2>
    <p class="meta" id="place"></p>
    <p class="about" id="about"></p>
    <div class="email-row">
      <span class="kicker">Registered email</span>
      <p id="email" style="margin: 0; font-weight: 600;"></p>
      <p class="note" id="joined"></p>
    </div>
    <div class="actions">
      <a class="ghost" href="../">Back to the circle</a>
      <button class="primary" id="sign-out" type="button">Sign out</button>
    </div>
  </section>
</main>
<script src="../assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/owner.js"></script>
</body>
</html>
